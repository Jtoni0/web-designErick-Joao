  <h1>FALE CONOSCO</h1>
  <h2>Como posso ajudar?</h2>
  <p>Para enviar sua mensagem, por favor, preencha os campos abaixo.</p>

    <form action="#" method="post">
        <label for="nomeCompleto">Nome Completo*</label><br>
        <input type="text" id="nomeCompleto" name="nomeCompleto" required><br><br>

        <label for="email">Email*</label><br>
        <input type="email" id="email" name="email" required><br><br>

        <label for="tipoUsuario">Tipo de usuário*</label><br>
      <select id="tipoUsuario" name="tipoUsuario" required>
            <option value="">Selecione um tipo de usuário</option>
            <option value="cliente">Cliente</option>
            <option value="fornecedor">Fornecedor</option>
            <option value="outro">Outro</option>
        </select><br><br>

        <label for="orgaoEntidade">Órgão/Entidade*</label><br>
        <select id="orgaoEntidade" name="orgaoEntidade" required>
            <option value="">Selecione um órgão</option>
            <option value="orgaoA">Davi</option>
            <option value="orgaoB">Erick</option>
        </select><br><br>

        <label for="assunto">Assunto*</label><br>
        <select id="assunto" name="assunto" required>
            <option value="">Selecione um assunto</option>
            <option value="sugestao">Sugestão</option>
            <option value="reclamacao">Reclamação</option>
            <option value="duvida">Dúvida</option>
        </select><br><br>

        <label for="descricaoDetalhada">Descrição detalhada 2000 caracteres*</label><br>
        <textarea id="descricaoDetalhada" name="descricaoDetalhada" rows="5" maxlength="2000" placeholder="Digite aqui sua Descrição detalhada" required></textarea><br><br>

        <input type="submit" value="Enviar Mensagem">
    </form> </center>
